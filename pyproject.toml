[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "linux-system-observatory"
version = "1.0.0"
description = "A comprehensive, private, modern system monitor for Linux desktops."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
keywords = ["system-monitor", "linux", "psutil", "qt", "pyside6", "hardware"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: End Users/Desktop",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Monitoring",
    "Topic :: System :: Systems Administration",
]

dependencies = [
    "PySide6>=6.6",
    "psutil>=5.9",
    "pyqtgraph>=0.13",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
]

[project.scripts]
observatory = "app.main:main"

[project.gui-scripts]
linux-system-observatory = "app.main:main"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
filterwarnings = ["error::DeprecationWarning:app.*"]

[tool.ruff]
line-length = 88
target-version = "py311"
src = ["app", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",    # pycodestyle
    "F",         # pyflakes
    "I",         # isort
    "N",         # pep8-naming
    "D",         # pydocstyle
    "UP",        # pyupgrade
    "B",         # bugbear
    "A",         # builtins shadowing
    "C4",        # comprehensions
    "SIM",       # simplify
    "RUF",       # ruff-specific
]
ignore = [
    "D107",   # __init__ docstring: the class docstring covers it
    "D203",   # incompatible with D211
    "D213",   # incompatible with D212
    "N818",   # error suffix on exceptions
    # Properties are conventionally documented descriptively ("True when the
    # driver is loaded"), not imperatively. Forcing "Return true when..." onto
    # every predicate reads worse, and this codebase has many of them.
    "D401",
    # Package __init__ modules here are namespace markers with no API to
    # document; the modules inside them carry the documentation.
    "D104",
    # Qt override methods (__bool__, paintEvent and friends) are documented by
    # the framework; repeating that here would be noise.
    "D105",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D100", "D103", "SLF001"]
"app/ui/*" = ["N802"]   # Qt requires camelCase event handler overrides

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
check_untyped_defs = true
exclude = ["tests/"]
